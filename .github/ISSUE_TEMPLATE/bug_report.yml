name: Bug Report
description: Report a defect in documentation, tooling, or future code
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill out the sections below.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
      placeholder: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior (if applicable).
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        OS, tool versions, and any relevant configuration.
      placeholder: |
        - OS: Windows 11 / Ubuntu 24.04 / macOS 15
        - Git: 2.56.0
        - CMake: 3.30
        - Compiler: MSVC 19.40 / GCC 14 / Clang 18
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Relevant logs, error messages, or command output.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: This is not a security vulnerability (report those via security@vyro.studio)
          required: true